name: Build APK
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Domain web kamu (https://...)"
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q StickerWeb-Android.zip
      - name: Set URL
        env:
          APP_URL: ${{ inputs.url }}
        run: sed -i "s|https://GANTI-DOMAIN-KAMU.example.com|$APP_URL|" StickerWeb-Android/app/src/main/java/com/renn/stickerweb/MainActivity.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
        working-directory: StickerWeb-Android
      - uses: actions/upload-artifact@v4
        with:
          name: StickerWeb-APK
          path: StickerWeb-Android/app/build/outputs/apk/debug/app-debug.apk

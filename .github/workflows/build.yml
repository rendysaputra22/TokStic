name: Build TokStic
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -oq StickerWeb-Android.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
        working-directory: StickerWeb-Android
      - name: Rename APK
        run: cp StickerWeb-Android/app/build/outputs/apk/debug/app-debug.apk TokStic.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TokStic
          path: TokStic.apk
